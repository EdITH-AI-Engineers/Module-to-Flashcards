name: Build portable Windows Mistral client

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-build.txt huggingface-hub
      - name: Install Tesseract OCR
        run: choco install tesseract -y --no-progress
      - name: Run regression checks
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Build portable client
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging/build_portable.ps1
      - name: Upload portable client
        uses: actions/upload-artifact@v4
        with:
          name: ModuleToFlashcards-portable-windows-x64
          path: dist/ModuleToFlashcards-*-windows-x64.zip
          if-no-files-found: error
